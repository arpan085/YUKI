<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f7efe6 0%, #f0e2d3 100%);
            color: #2c1d1d;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .game-shell {
            width: min(760px, 100%);
            background: rgba(255,255,255,0.42);
            border: 1px solid rgba(58, 41, 47, 0.08);
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(74, 54, 62, 0.08);
            padding: 22px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255,255,255,0.72);
            color: #2c1d1d;
            font-size: 1.4rem;
            font-weight: 700;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 600;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .score {
            background: rgba(255,255,255,0.7);
            border-radius: 999px;
            padding: 9px 14px;
            font-weight: 700;
            color: #5a3e45;
        }

        .small-btn {
            border: none;
            background: linear-gradient(135deg, #ffbf69 0%, #ff8aaa 100%);
            color: #2c1d1d;
            font-weight: 700;
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(255, 150, 134, 0.25);
        }

        .tap-stage {
            position: relative;
            height: 420px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(250,226,196,0.18));
            border: 1px dashed rgba(91, 76, 86, 0.18);
            overflow: hidden;
        }

        .tap-target {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: radial-gradient(circle at 35% 30%, #fff1b2 0%, #ffc857 38%, #ff9a63 100%);
            box-shadow: 0 15px 25px rgba(255, 149, 103, 0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #5e2a2a;
            transition: transform 0.12s ease;
        }

        .tap-target:active {
            transform: scale(0.94);
        }

        @media (max-width: 640px) {
            .topbar { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="topbar">
            <a class="back-btn" href="games.html" aria-label="Back to games">←</a>
            <h1>Tap Rush</h1>
        </div>

        <div class="status-row">
            <div class="score" id="tapScore">Score: 0</div>
            <button class="small-btn" id="resetTap">Restart</button>
        </div>

        <div class="tap-stage" id="tapStage">
            <button id="tapTarget" class="tap-target" aria-label="Tap target">★</button>
        </div>
    </div>

    <script>
        const tapStage = document.getElementById('tapStage');
        const tapTarget = document.getElementById('tapTarget');
        const tapScore = document.getElementById('tapScore');
        const resetTap = document.getElementById('resetTap');
        let tapCount = 0;

        function moveTarget() {
            const maxX = tapStage.clientWidth - tapTarget.offsetWidth;
            const maxY = tapStage.clientHeight - tapTarget.offsetHeight;
            const x = Math.random() * Math.max(maxX, 1);
            const y = Math.random() * Math.max(maxY, 1);
            tapTarget.style.left = `${x}px`;
            tapTarget.style.top = `${y}px`;
        }

        function resetTapGame() {
            tapCount = 0;
            tapScore.textContent = 'Score: 0';
            moveTarget();
        }

        tapTarget.addEventListener('click', () => {
            tapCount += 1;
            tapScore.textContent = `Score: ${tapCount}`;
            moveTarget();
        });

        resetTap.addEventListener('click', resetTapGame);
        resetTapGame();
    </script>
</body>
</html>
