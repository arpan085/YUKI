<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f7efe6 0%, #f0e2d3 100%);
            color: #2c1d1d;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .game-shell {
            width: min(760px, 100%);
            background: rgba(255,255,255,0.42);
            border: 1px solid rgba(58, 41, 47, 0.08);
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(74, 54, 62, 0.08);
            padding: 22px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255,255,255,0.72);
            color: #2c1d1d;
            font-size: 1.4rem;
            font-weight: 700;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 600;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .score {
            background: rgba(255,255,255,0.7);
            border-radius: 999px;
            padding: 9px 14px;
            font-weight: 700;
            color: #5a3e45;
        }

        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .small-btn {
            border: none;
            background: linear-gradient(135deg, #ffbf69 0%, #ff8aaa 100%);
            color: #2c1d1d;
            font-weight: 700;
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(255, 150, 134, 0.25);
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-top: 10px;
        }

        .memory-card {
            aspect-ratio: 1;
            border: none;
            border-radius: 18px;
            font-size: 1.7rem;
            background: linear-gradient(135deg, #ffd9c7 0%, #ffc4d8 100%);
            box-shadow: inset 0 0 0 1px rgba(103, 76, 79, 0.08);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .memory-card.flipped,
        .memory-card.matched {
            background: linear-gradient(135deg, #ffffff 0%, #f3e9d9 100%);
            box-shadow: 0 8px 18px rgba(88, 60, 76, 0.12);
        }

        .memory-card.matched {
            background: linear-gradient(135deg, #dff7ea 0%, #b8f0d0 100%);
        }

        .memory-card:active {
            transform: scale(0.97);
        }

        @media (max-width: 640px) {
            .memory-grid { gap: 10px; }
            .topbar { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="topbar">
            <a class="back-btn" href="games.html" aria-label="Back to games">←</a>
            <h1>Memory Match</h1>
        </div>

        <div class="status-row">
            <div class="score" id="memoryScore">Moves: 0</div>
            <div class="button-row">
                <button class="small-btn" id="resetMemory">Restart</button>
            </div>
        </div>

        <div class="memory-grid" id="memoryGrid"></div>
    </div>

    <script>
        const symbols = ['✨', '💖', '🎁', '🌸', '☀️', '🎉'];
        const memoryGrid = document.getElementById('memoryGrid');
        const memoryScore = document.getElementById('memoryScore');
        const resetMemory = document.getElementById('resetMemory');

        let selectedCards = [];
        let moves = 0;
        let lockBoard = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function buildBoard() {
            const deck = shuffle([...symbols, ...symbols]);
            memoryGrid.innerHTML = '';
            selectedCards = [];
            lockBoard = false;
            moves = 0;
            memoryScore.textContent = 'Moves: 0';

            deck.forEach((symbol) => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'memory-card';
                card.dataset.symbol = symbol;
                card.textContent = '?';
                card.addEventListener('click', () => flipCard(card));
                memoryGrid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            card.textContent = card.dataset.symbol;
            card.classList.add('flipped');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                moves++;
                memoryScore.textContent = `Moves: ${moves}`;
                lockBoard = true;

                const [first, second] = selectedCards;
                if (first.dataset.symbol === second.dataset.symbol) {
                    setTimeout(() => {
                        first.classList.add('matched');
                        second.classList.add('matched');
                        selectedCards = [];
                        lockBoard = false;
                    }, 250);
                } else {
                    setTimeout(() => {
                        first.textContent = '?';
                        second.textContent = '?';
                        first.classList.remove('flipped');
                        second.classList.remove('flipped');
                        selectedCards = [];
                        lockBoard = false;
                    }, 700);
                }
            }
        }

        resetMemory.addEventListener('click', buildBoard);
        buildBoard();
    </script>
</body>
</html>
