<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Photo Shooter</title>
    <style>
        :root {
            --bg-1: #05070b;
            --bg-2: #111821;
            --panel: rgba(14, 22, 34, 0.72);
            --panel-strong: rgba(18, 28, 42, 0.92);
            --text: #edf3ff;
            --muted: #a7b3c8;
            --accent: #ffb84d;
            --danger: #ff5c7a;
            --good: #7ef0c0;
            --shadow: rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            position: relative;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at center, rgba(36, 52, 72, 0.9), rgba(3, 6, 12, 1) 45%),
                linear-gradient(180deg, rgba(16, 24, 36, 0.2), rgba(8, 12, 18, 0.8));
        }

        #targetsLayer,
        #effectsLayer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 2;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: calc(12px + env(safe-area-inset-top)) 12px 8px;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
        }

        .hud-pill {
            min-width: 92px;
            background: rgba(17, 27, 38, 0.72);
            border: 1px solid rgba(124, 167, 240, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 6px 10px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .hud-pill .label {
            display: block;
            font-size: 9px;
            letter-spacing: 1.4px;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .hud-pill .value {
            display: block;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
        }

        .value.low {
            color: #ff7d7d;
        }

        #reloadBtn {
            position: absolute;
            left: 16px;
            bottom: calc(18px + env(safe-area-invert-bottom, 0px));
            z-index: 30;
            border: 1px solid rgba(123, 164, 239, 0.3);
            background: rgba(17, 27, 38, 0.86);
            color: var(--text);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.4px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: opacity 0.25s ease, transform 0.15s ease;
        }

        #reloadBtn:active {
            transform: scale(0.96);
        }

        #reloadBtn.busy {
            opacity: 0.5;
        }

        #gun {
            position: absolute;
            right: clamp(8px, 2.8vw, 28px);
            bottom: calc(12px + env(safe-area-inset-bottom));
            width: clamp(150px, 30vw, 230px);
            height: clamp(110px, 18vw, 160px);
            transform-origin: 85% 80%;
            z-index: 20;
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.3));
        }

        #gun svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #gun.recoil {
            animation: recoil 0.18s ease-out;
        }

        #gun.reloading {
            animation: reloadPose 1.1s ease-in-out;
        }

        @keyframes recoil {
            0% { transform: rotate(-18deg) translate(0, 0) scale(1); }
            20% { transform: rotate(-22deg) translate(6px, 8px) scale(1.02); }
            100% { transform: rotate(-18deg) translate(0, 0) scale(1); }
        }

        @keyframes reloadPose {
            0% { transform: rotate(-18deg) translate(0, 0); }
            25% { transform: rotate(-8deg) translate(18px, 28px); }
            75% { transform: rotate(-8deg) translate(18px, 28px); }
            100% { transform: rotate(-18deg) translate(0, 0); }
        }

        #flash {
            position: absolute;
            left: 2%;
            top: 35%;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,245,196,1) 0%, rgba(255,198,99,1) 22%, rgba(255,138,58,0.8) 42%, rgba(255,90,0,0) 72%);
            opacity: 0;
            transform: scale(0.5);
            z-index: 18;
        }

        #flash.on {
            animation: flashAnim 0.11s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 1; transform: scale(0.45); }
            100% { opacity: 0; transform: scale(1.8); }
        }

        .target {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 102, 102, 0.9);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 16px 30px rgba(0,0,0,0.28);
            background: linear-gradient(135deg, #1d2430, #0f1520);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .target img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
            filter: saturate(1.05) contrast(1.05);
        }

        .target::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, transparent 0 55%, rgba(255,255,255,0.12) 55% 58%, transparent 58% 100%);
            z-index: 2;
        }

        .target::after {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.66);
            z-index: 3;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
        }

        .target.hit {
            animation: hitPulse 0.25s ease-out forwards;
        }

        @keyframes hitPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.2); opacity: 0; }
        }

        .tracer {
            position: absolute;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,232,173,0.95) 25%, rgba(255,174,82,0.85) 100%);
            box-shadow: 0 0 10px rgba(255, 183, 76, 0.8);
            pointer-events: none;
            z-index: 10;
            transform-origin: left center;
            animation: tracerFade 0.12s ease-out forwards;
        }

        @keyframes tracerFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .impact {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255,237,175,0.8);
            box-shadow: 0 0 16px rgba(255,205,88,0.6);
            transform: translate(-50%, -50%) scale(0.5);
            animation: impact 0.3s ease-out forwards;
            pointer-events: none;
            z-index: 12;
        }

        @keyframes impact {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
        }

        .float-score {
            position: absolute;
            font-weight: 900;
            font-size: 1.05rem;
            color: #ffd166;
            text-shadow: 0 0 8px rgba(255,195,80,0.8);
            animation: floatScore 0.7s ease-out forwards;
            pointer-events: none;
            z-index: 14;
        }

        @keyframes floatScore {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.75); }
            35% { opacity: 1; transform: translate(-50%, -90%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
        }

        #crosshair {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.82);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 16;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: rgba(255,255,255,0.82);
        }

        #crosshair::before {
            width: 2px;
            height: 32px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #crosshair::after {
            width: 32px;
            height: 2px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #crosshair.visible {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: radial-gradient(ellipse at center, rgba(18, 31, 46, 0.9), rgba(1, 4, 9, 0.98));
            backdrop-filter: blur(6px);
            z-index: 40;
            transition: opacity 0.25s ease;
            padding: 24px;
            text-align: center;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .panel {
            max-width: 440px;
            width: min(92vw, 440px);
            background: rgba(18, 29, 46, 0.78);
            border: 1px solid rgba(145, 182, 236, 0.24);
            border-radius: 26px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            padding: 26px 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            line-height: 1;
        }

        h2 {
            margin: 0 0 10px;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 5vw, 2.6rem);
        }

        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.6;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin: 18px 0;
        }

        .time-btn {
            border: 1px solid rgba(152, 178, 214, 0.25);
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            font-size: 1rem;
            font-weight: 800;
            padding: 14px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-btn.active {
            background: linear-gradient(135deg, #ffb754 0%, #ff8ca5 100%);
            color: #1d1428;
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 12px 24px rgba(255, 144, 122, 0.28);
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #ffb754 0%, #ff8ca5 100%);
            color: #1d1428;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 16px 30px rgba(255, 139, 115, 0.3);
        }

        .small-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .secondary-btn {
            border: 1px solid rgba(152, 178, 214, 0.25);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 700;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 16px 0;
        }

        .stat-box {
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(152, 178, 214, 0.2);
            padding: 12px 10px;
        }

        .stat-box .mini-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.3px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-box .mini-value {
            font-weight: 800;
            font-size: 1.15rem;
        }

        @media (max-width: 540px) {
            #hud {
                gap: 8px;
            }

            .hud-pill {
                min-width: 78px;
            }

            #reloadBtn {
                left: 12px;
                bottom: calc(14px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="hud">
            <div class="hud-pill">
                <span class="label">TIME</span>
                <span class="value" id="timeValue">15</span>
            </div>
            <div class="hud-pill">
                <span class="label">SCORE</span>
                <span class="value" id="scoreValue">0</span>
            </div>
            <div class="hud-pill">
                <span class="label">AMMO</span>
                <span class="value" id="ammoValue">8</span>
            </div>
        </div>

        <button id="reloadBtn" type="button">RELOAD</button>

        <div id="targetsLayer"></div>
        <div id="effectsLayer"></div>

        <div id="crosshair"></div>

        <div id="gun">
            <div id="flash"></div>
            <svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg" aria-label="Gun illustration">
                <defs>
                    <linearGradient id="slideGrad" x1="0" x2="1" y1="0" y2="0">
                        <stop offset="0%" stop-color="#3b424e" />
                        <stop offset="45%" stop-color="#262b34" />
                        <stop offset="100%" stop-color="#171b21" />
                    </linearGradient>
                    <linearGradient id="gripGrad" x1="0" x2="1" y1="0" y2="1">
                        <stop offset="0%" stop-color="#2a2f38" />
                        <stop offset="100%" stop-color="#12151a" />
                    </linearGradient>
                </defs>
                <path d="M146 68 L206 68 L216 152 L158 152 Z" fill="url(#gripGrad)" stroke="#0d1014" stroke-width="2" />
                <g stroke="#0a0c10" stroke-width="2" opacity="0.55">
                    <line x1="152" y1="84" x2="208" y2="84" />
                    <line x1="152" y1="96" x2="208" y2="96" />
                    <line x1="152" y1="108" x2="208" y2="108" />
                    <line x1="160" y1="120" x2="208" y2="120" />
                </g>
                <path d="M148 74 C 112 80, 108 112, 146 114" fill="none" stroke="#232830" stroke-width="10" stroke-linecap="round"/>
                <path d="M148 74 C 112 80, 108 112, 146 114" fill="none" stroke="#2e3542" stroke-width="6" stroke-linecap="round"/>
                <path d="M138 80 Q 128 94 138 104" fill="none" stroke="#0d1014" stroke-width="6" stroke-linecap="round"/>
                <rect x="34" y="34" width="166" height="42" rx="10" fill="url(#slideGrad)" stroke="#0d1014" stroke-width="2"/>
                <rect x="42" y="40" width="150" height="6" rx="3" fill="#4b5565" opacity="0.7"/>
                <rect x="150" y="40" width="4" height="30" fill="#1a1d23"/>
                <rect x="163" y="40" width="4" height="30" fill="#1a1d23"/>
                <rect x="176" y="40" width="4" height="30" fill="#1a1d23"/>
                <rect x="17" y="40" width="20" height="30" rx="4" fill="#15181d"/>
                <circle cx="27" cy="55" r="7" fill="#0a0c0f"/>
                <circle cx="27" cy="55" r="2.5" fill="#3b424e"/>
                <path d="M120 76 Q 104 106 127 117" fill="none" stroke="#2c313a" stroke-width="8" stroke-linecap="round"/>
                <path d="M126 82 Q 118 93 126 104" fill="none" stroke="#0f1115" stroke-width="6" stroke-linecap="round"/>
                <rect x="138" y="58" width="22" height="4" rx="2" fill="#dce6f6" opacity="0.8"/>
            </svg>
        </div>
    </div>

    <div id="menuOverlay" class="overlay">
        <div class="panel">
            <h1>Photo Shooter</h1>
            <p class="subtitle">Tap targets, reload fast, and beat the clock.</p>

            <div class="time-grid">
                <button class="time-btn active" data-seconds="15" type="button">15s</button>
                <button class="time-btn" data-seconds="30" type="button">30s</button>
                <button class="time-btn" data-seconds="60" type="button">1 min</button>
            </div>

            <button id="startBtn" class="primary-btn" type="button">Start Game</button>
        </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <div class="panel">
            <h2>Time's Up</h2>
            <div class="stats">
                <div class="stat-box">
                    <span class="mini-label">Score</span>
                    <span class="mini-value" id="finalScore">0</span>
                </div>
                <div class="stat-box">
                    <span class="mini-label">Accuracy</span>
                    <span class="mini-value" id="finalAccuracy">0%</span>
                </div>
                <div class="stat-box">
                    <span class="mini-label">Hits</span>
                    <span class="mini-value" id="finalHits">0</span>
                </div>
                <div class="stat-box">
                    <span class="mini-label">Best</span>
                    <span class="mini-value" id="finalBest">0</span>
                </div>
            </div>

            <div class="small-row">
                <button id="retryBtn" class="secondary-btn" type="button">Play Again</button>
                <button id="menuBtn" class="secondary-btn" type="button">Menu</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const PHOTO_SEEDS = [
                'portrait-1', 'portrait-2', 'portrait-3', 'portrait-4',
                'travel-1', 'travel-2', 'city-1', 'city-2', 'nature-1', 'nature-2'
            ];

            const game = document.getElementById('game');
            const targetsLayer = document.getElementById('targetsLayer');
            const effectsLayer = document.getElementById('effectsLayer');
            const gun = document.getElementById('gun');
            const flash = document.getElementById('flash');
            const reloadBtn = document.getElementById('reloadBtn');
            const crosshair = document.getElementById('crosshair');
            const menuOverlay = document.getElementById('menuOverlay');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const startBtn = document.getElementById('startBtn');
            const retryBtn = document.getElementById('retryBtn');
            const menuBtn = document.getElementById('menuBtn');

            const timeValue = document.getElementById('timeValue');
            const ammoValue = document.getElementById('ammoValue');
            const scoreValue = document.getElementById('scoreValue');

            const finalScore = document.getElementById('finalScore');
            const finalAccuracy = document.getElementById('finalAccuracy');
            const finalHits = document.getElementById('finalHits');
            const finalBest = document.getElementById('finalBest');

            const timeButtons = [...document.querySelectorAll('.time-btn')];
            const MAG_SIZE = 8;
            const RELOAD_DELAY = 1.05;

            let selectedSeconds = 15;
            let state = null;
            let rafId = null;
            let audioCtx = null;
            let masterGain = null;
            let nextPhotoIndex = 0;

            function getBestScore() {
                return Number(localStorage.getItem('photoShooterBest') || 0);
            }

            function setBestScore(score) {
                localStorage.setItem('photoShooterBest', String(score));
            }

            function ensureAudio() {
                if (!audioCtx) {
                    const AudioClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioClass) return null;
                    audioCtx = new AudioClass();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = 0.52;
                    masterGain.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            function playNoiseBurst(duration, startFreq, endFreq, volume, lowpass = false) {
                const ctx = ensureAudio();
                if (!ctx) return;
                const t = ctx.currentTime;
                const len = Math.max(1, Math.floor(ctx.sampleRate * duration));
                const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < len; i++) {
                    const progress = i / len;
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - progress, 4);
                }

                const source = ctx.createBufferSource();
                source.buffer = buffer;

                const filt = ctx.createBiquadFilter();
                filt.type = lowpass ? 'lowpass' : 'bandpass';
                filt.frequency.setValueAtTime(startFreq, t);
                if (endFreq) {
                    filt.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
                }
                filt.Q.value = 1.2;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(volume, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

                source.connect(filt);
                filt.connect(gain);
                gain.connect(masterGain);

                source.start(t);
                source.stop(t + duration + 0.02);
            }

            function playShotSound() {
                const ctx = ensureAudio();
                if (!ctx) return;
                const t = ctx.currentTime;

                playNoiseBurst(0.22, 4200, 260, 0.35, true);

                const osc = ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.12);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.36, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start(t);
                osc.stop(t + 0.2);
            }

            function playHitSound(bullseye) {
                const ctx = ensureAudio();
                if (!ctx) return;
                const t = ctx.currentTime;

                const osc = ctx.createOscillator();
                osc.type = bullseye ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(bullseye ? 1500 : 850, t);
                osc.frequency.exponentialRampToValueAtTime(bullseye ? 1100 : 560, t + 0.18);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.24, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start(t);
                osc.stop(t + 0.22);
            }

            function playReloadSound() {
                const ctx = ensureAudio();
                if (!ctx) return;
                const t = ctx.currentTime;

                const osc = ctx.createOscillator();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, t);
                osc.frequency.exponentialRampToValueAtTime(95, t + 0.1);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.18, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

                osc.connect(gain);
                gain.connect(masterGain);

                osc.start(t);
                osc.stop(t + 0.12);
            }

            function showCrosshair(x, y) {
                crosshair.style.left = `${x}px`;
                crosshair.style.top = `${y}px`;
                crosshair.classList.add('visible');
            }

            function hideCrosshair() {
                crosshair.classList.remove('visible');
            }

            function setSelectedDuration(seconds) {
                selectedSeconds = seconds;
                timeButtons.forEach((button) => {
                    button.classList.toggle('active', Number(button.dataset.seconds) === seconds);
                });
            }

            function updateHud() {
                if (!state) return;

                const timeLabel = Math.max(0, Math.ceil(state.timeLeft));
                timeValue.textContent = String(timeLabel);
                timeValue.classList.toggle('low', timeLabel <= 5);
                ammoValue.textContent = `${state.ammo}/${MAG_SIZE}`;
                scoreValue.textContent = String(state.score);
            }

            function createTarget() {
                const target = document.createElement('div');
                target.className = 'target';

                const img = document.createElement('img');
                const photoSeed = PHOTO_SEEDS[nextPhotoIndex % PHOTO_SEEDS.length];
                nextPhotoIndex += 1;
                img.src = `https://picsum.photos/seed/${photoSeed}-${Math.floor(Math.random() * 999)}/180/180`;
                img.alt = 'Target photo';
                img.loading = 'eager';
                target.appendChild(img);

                const baseSize = 58 + Math.random() * 26;
                const maxX = game.clientWidth - baseSize - 24;
                const maxY = game.clientHeight - baseSize - 110;

                const x = 20 + Math.random() * (maxX - 20);
                const y = 80 + Math.random() * (maxY - 80);

                target.style.width = `${baseSize}px`;
                target.style.height = `${baseSize}px`;
                target.style.left = `${x}px`;
                target.style.top = `${y}px`;

                const driftX = (Math.random() * 2 - 1) * 24;
                const driftY = (Math.random() * 2 - 1) * 20;

                const targetData = {
                    element: target,
                    x,
                    y,
                    size: baseSize,
                    vx: driftX,
                    vy: driftY,
                    life: 2.6 + Math.random() * 1.6,
                    age: 0,
                    alive: true,
                };

                targetsLayer.appendChild(target);
                state.targets.push(targetData);
            }

            function removeTarget(targetData, hit = false) {
                if (!targetData || !targetData.alive) return;
                targetData.alive = false;

                if (hit) {
                    targetData.element.classList.add('hit');
                    setTimeout(() => targetData.element.remove(), 230);
                } else {
                    targetData.element.remove();
                }
            }

            function updateTargets(dt) {
                if (!state) return;
                const { width, height } = game.getBoundingClientRect();

                for (let i = state.targets.length - 1; i >= 0; i--) {
                    const item = state.targets[i];
                    if (!item.alive) {
                        state.targets.splice(i, 1);
                        continue;
                    }

                    item.age += dt;
                    item.x += item.vx * dt;
                    item.y += item.vy * dt;

                    if (item.x < 10 || item.x > width - item.size - 10) {
                        item.vx *= -1;
                        item.x = Math.min(Math.max(item.x, 10), width - item.size - 10);
                    }

                    if (item.y < 74 || item.y > height - item.size - 74) {
                        item.vy *= -1;
                        item.y = Math.min(Math.max(item.y, 74), height - item.size - 74);
                    }

                    item.element.style.left = `${item.x}px`;
                    item.element.style.top = `${item.y}px`;

                    if (item.age >= item.life) {
                        removeTarget(item, false);
                        state.targets.splice(i, 1);
                    }
                }
            }

            function spawnTargets() {
                if (!state) return;
                const desired = Math.min(4, 1 + Math.floor(state.timeLeft / 18));
                while (state.targets.length < desired) {
                    createTarget();
                }
            }

            function triggerFlash() {
                flash.classList.remove('on');
                void flash.offsetWidth;
                flash.classList.add('on');
            }

            function triggerGunRecoil() {
                gun.classList.remove('recoil');
                void gun.offsetWidth;
                gun.classList.add('recoil');
            }

            function addTracer(fromX, fromY, toX, toY) {
                const tracer = document.createElement('div');
                const dx = toX - fromX;
                const dy = toY - fromY;
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                const length = Math.hypot(dx, dy);

                tracer.className = 'tracer';
                tracer.style.left = `${fromX}px`;
                tracer.style.top = `${fromY}px`;
                tracer.style.width = `${length}px`;
                tracer.style.transform = `rotate(${angle}deg)`;

                effectsLayer.appendChild(tracer);
                setTimeout(() => tracer.remove(), 120);
            }

            function addImpact(x, y) {
                const impact = document.createElement('div');
                impact.className = 'impact';
                impact.style.left = `${x}px`;
                impact.style.top = `${y}px`;
                effectsLayer.appendChild(impact);
                setTimeout(() => impact.remove(), 300);
            }

            function addFloatScore(x, y, scoreText) {
                const node = document.createElement('div');
                node.className = 'float-score';
                node.textContent = `+${scoreText}`;
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                effectsLayer.appendChild(node);
                setTimeout(() => node.remove(), 700);
            }

            function computeMuzzlePoint() {
                const rect = gun.getBoundingClientRect();
                const gameRect = game.getBoundingClientRect();
                return {
                    x: rect.left - gameRect.left + rect.width * 0.12,
                    y: rect.top - gameRect.top + rect.height * 0.34,
                };
            }

            function autoReloadIfNeeded() {
                if (state.ammo <= 0 && !state.reloading) {
                    startReload();
                }
            }

            function startReload() {
                if (!state || state.reloading || state.ammo === MAG_SIZE) return;

                state.reloading = true;
                reloadBtn.classList.add('busy');
                gun.classList.remove('reloading');
                void gun.offsetWidth;
                gun.classList.add('reloading');
                playReloadSound();

                setTimeout(() => {
                    if (!state) return;
                    state.ammo = MAG_SIZE;
                    state.reloading = false;
                    reloadBtn.classList.remove('busy');
                    updateHud();
                }, RELOAD_DELAY * 1000);
            }

            function shoot(x, y) {
                if (!state || !state.running || state.reloading) return;

                if (state.ammo <= 0) {
                    autoReloadIfNeeded();
                    return;
                }

                state.ammo -= 1;
                state.shots += 1;
                playShotSound();

                const muzzle = computeMuzzlePoint();
                addTracer(muzzle.x, muzzle.y, x, y);
                triggerFlash();
                triggerGunRecoil();

                const hitTarget = findClosestTarget(x, y);
                if (hitTarget) {
                    const dx = x - (hitTarget.x + hitTarget.size / 2);
                    const dy = y - (hitTarget.y + hitTarget.size / 2);
                    const centerDistance = Math.hypot(dx, dy);
                    const normalized = centerDistance / (hitTarget.size / 2);

                    let points = 15;
                    let bullseye = false;

                    if (normalized < 0.22) {
                        points = 100;
                        bullseye = true;
                    } else if (normalized < 0.5) {
                        points = 60;
                    } else if (normalized < 0.82) {
                        points = 30;
                    }

                    state.hits += 1;
                    state.score += points;
                    addImpact(x, y);
                    addFloatScore(x, y, points);
                    playHitSound(bullseye);
                    removeTarget(hitTarget, true);

                    const index = state.targets.findIndex((item) => item === hitTarget);
                    if (index >= 0) {
                        state.targets.splice(index, 1);
                    }
                } else {
                    addImpact(x, y);
                }

                updateHud();
                autoReloadIfNeeded();
            }

            function findClosestTarget(x, y) {
                let best = null;
                let bestDistance = Infinity;

                for (const item of state.targets) {
                    if (!item.alive) continue;
                    const targetCenterX = item.x + item.size / 2;
                    const targetCenterY = item.y + item.size / 2;
                    const distance = Math.hypot(x - targetCenterX, y - targetCenterY);

                    if (distance <= item.size * 0.56 && distance < bestDistance) {
                        bestDistance = distance;
                        best = item;
                    }
                }

                return best;
            }

            function endGame() {
                if (!state) return;
                state.running = false;
                cancelAnimationFrame(rafId);

                const accuracy = state.shots ? Math.round((state.hits / state.shots) * 100) : 0;
                const best = getBestScore();
                if (state.score > best) {
                    setBestScore(state.score);
                }

                finalScore.textContent = String(state.score);
                finalAccuracy.textContent = `${accuracy}%`;
                finalHits.textContent = String(state.hits);
                finalBest.textContent = String(Math.max(best, state.score));

                gameOverOverlay.classList.remove('hidden');
            }

            function loop(ts) {
                if (!state || !state.running) return;

                const dt = Math.min((ts - state.lastTs) / 1000 || 0.016, 0.05);
                state.lastTs = ts;
                state.timeLeft -= dt;

                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    updateHud();
                    endGame();
                    return;
                }

                updateTargets(dt);
                spawnTargets();
                updateHud();
                rafId = requestAnimationFrame(loop);
            }

            function startGame() {
                menuOverlay.classList.add('hidden');
                gameOverOverlay.classList.add('hidden');
                targetsLayer.innerHTML = '';
                effectsLayer.innerHTML = '';
                state = {
                    running: true,
                    timeLeft: selectedSeconds,
                    score: 0,
                    hits: 0,
                    shots: 0,
                    ammo: MAG_SIZE,
                    reloading: false,
                    targets: [],
                    lastTs: performance.now(),
                };

                updateHud();
                spawnTargets();
                rafId = requestAnimationFrame(loop);
            }

            function attachEvents() {
                timeButtons.forEach((button) => {
                    button.addEventListener('click', () => setSelectedDuration(Number(button.dataset.seconds)));
                });

                startBtn.addEventListener('click', startGame);
                retryBtn.addEventListener('click', startGame);
                menuBtn.addEventListener('click', () => {
                    menuOverlay.classList.remove('hidden');
                    gameOverOverlay.classList.add('hidden');
                    if (rafId) cancelAnimationFrame(rafId);
                    state = null;
                    targetsLayer.innerHTML = '';
                    effectsLayer.innerHTML = '';
                    updateHud();
                });

                reloadBtn.addEventListener('click', () => {
                    if (state) {
                        startReload();
                    }
                });

                game.addEventListener('pointerdown', (event) => {
                    if (!state || !state.running) return;
                    if (event.target.closest('#reloadBtn')) return;
                    event.preventDefault();

                    const rect = game.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    shoot(x, y);
                    showCrosshair(x, y);
                }, { passive: false });

                game.addEventListener('pointermove', (event) => {
                    const rect = game.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    showCrosshair(x, y);
                });

                game.addEventListener('pointerleave', () => {
                    hideCrosshair();
                });
            }

            attachEvents();
            updateHud();
        })();
    </script>
</body>
</html>
